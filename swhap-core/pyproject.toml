[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swhap-core"
version = "0.1.0"
description = "Deterministic Layer-1 SWHAP workbench generator (M1a: read-only inspect slice)"
requires-python = ">=3.11"
# stdlib-only at runtime (core-pipeline.md §2). pytest is dev-only.
dependencies = []

[project.scripts]
swhap = "swhap_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
