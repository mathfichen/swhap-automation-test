name: ci
# Root CI for the monorepo. The engine carries its own ci.yml under
# engine/.github/, which GitHub does NOT run (only root .github/workflows/ runs).
# This workflow runs the engine's suites and lints the whole tree.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * 1' # weekly: catches upstream fixture drift

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color
      - name: shellcheck
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 --no-run-if-empty shellcheck
      - name: ruff
        run: |
          if find . -name '*.py' -not -path './.git/*' | grep -q .; then
            pipx run ruff check .
          else
            echo "no Python — skipped"
          fi

  engine-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install engine + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e swhap-core -e tools/validator pytest jsonschema pyld
      - name: pytest (all engine suites)
        run: python -m pytest -q

  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: verify wildlife fixtures
        run: bash engine/fixtures/wildlife/acquire.sh
