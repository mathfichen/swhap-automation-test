name: ci
# CI on the toolkit itself from M1a (crit-M13; cicd-packaging W1).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * 1' # weekly: catches upstream drift (fixture re-verification)

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color
      - name: shellcheck
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck
      - name: ruff (when Python lands)
        run: |
          if find . -name '*.py' -not -path './.git/*' | grep -q .; then
            pipx run ruff check .
          else
            echo "no Python yet — skipped"
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Editable installs make swhap_core / swhap_validate importable; the
      # top-level pyproject.toml [tool.pytest.ini_options] discovers all three
      # W2 suites (fixtures/tests, swhap-core/tests, tools/validator/tests).
      # jsonschema + pyld are validator test-only deps (CM-3 JSON-LD, report
      # schema checks); runtimes stay stdlib-only.
      - name: install packages + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e swhap-core -e tools/validator pytest jsonschema pyld
      - name: pytest (all suites)
        run: python -m pytest -q

  fixtures:
    # Re-acquires from upstream and verifies bundle + tarballs against the
    # frozen manifest: detects upstream tampering/drift (weekly + every PR).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: verify wildlife fixtures
        run: bash fixtures/wildlife/acquire.sh
